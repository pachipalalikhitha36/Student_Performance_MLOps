<!DOCTYPE html>
<html>

<head>
    <title>Student Performance Prediction</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
        }

        .container {
            width: 450px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
        }

        button {
            padding: 12px 25px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Performance Prediction</h1>

    <form action="/predict" method="POST">

        <input
            type="number"
            step="0.1"
            name="study_hours"
            placeholder="Study Hours"
            required
        >

        <input
            type="number"
            step="0.1"
            name="attendance"
            placeholder="Attendance (%)"
            required
        >

        <input
            type="number"
            step="0.1"
            name="previous_marks"
            placeholder="Previous Marks"
            required
        >

        <input
            type="number"
            step="0.1"
            name="assignment_score"
            placeholder="Assignment Score"
            required
        >

        <input
            type="number"
            step="0.1"
            name="internal_marks"
            placeholder="Internal Marks"
            required
        >

        <br>

        <button type="submit">
            Predict Performance
        </button>

    </form>

</div>

</body>

</html>
